[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accra-hydro-insar-engine"
version = "1.0.0"
description = "Coupled Satellite InSAR Subsidence & Extreme Value Theory (EVT) Rainfall Hazard Intelligence Engine for Greater Accra, Ghana"
readme = "README.md"
authors = [
    { name = "Peter Aryee", email = "p.aryee@alumni.imperial.ac.uk" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Hydrology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.1.0",
    "matplotlib>=3.6.0",
    "folium>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
accra-engine = "run_engine:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v"
